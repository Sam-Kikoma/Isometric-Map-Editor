services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isoedit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-isoedit}
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-isoedit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-isoedit}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
    depends_on:
      - db

  yjs-ws:
    build:
      context: ./server/yjs-ws
    expose:
      - "1234"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    ports:
      - "80:80"
    depends_on:
      - server
      - yjs-ws

volumes:
  pgdata:
